
name: Build Shaf Retouch APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o ShafRetouch_APK_Build_Ready.zip -d project

      - name: Locate Android project
        run: |
          find project -name settings.gradle \
            -o -name settings.gradle.kts \
            -o -name gradlew

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShafRetouch-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
