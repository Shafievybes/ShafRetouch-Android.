name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Build Android Project
        shell: bash
        run: |
          # If a ZIP file exists in the repo, extract it automatically
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found a ZIP file, extracting..."
            python3 -c "
            from pathlib import Path
            from zipfile import ZipFile
            for archive in Path('.').glob('*.zip'):
                with ZipFile(archive) as z:
                    z.extractall('extracted_project')
            "
          fi

          # Automatically find where gradlew is located
          GRADLEW_PATH=$(find . -name "gradlew" -type f -not -path "*/.*" | head -n 1)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found anywhere in the repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
